name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hellofresh
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: hellofresh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hellofresh"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test (./mvnw verify, H2)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Smoke test the jar against real PostgreSQL (prod profile, Flyway)
        env:
          SPRING_PROFILES_ACTIVE: prod
          DATABASE_URL: postgresql://hellofresh:ci-only-password@localhost:5432/hellofresh?sslmode=disable
        run: |
          java -jar target/hellofresh-api.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health
          curl -fsS "http://localhost:8080/api/meal-kits?size=2" | grep -q '"totalElements":4'
          curl -fsS -X POST http://localhost:8080/api/plan-requests \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@example.com","people":2,"mealsPerWeek":3}' | grep -q '"RECEIVED"'
          echo "PostgreSQL smoke test passed"

      - name: Show app log on failure
        if: failure()
        run: cat app.log || true

      - name: Build Docker image
        run: docker build -t hellofresh-api:ci .
