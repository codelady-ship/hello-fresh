spring:
  application:
    name: hellofresh-api
  profiles:
    # `./mvnw spring-boot:run` uses the in-memory H2 database unless another profile is set.
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 50
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method

app:
  cors:
    # Exact origin for GitHub Pages plus any localhost/127.0.0.1 port for local development.
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGINS:https://codelady-ship.github.io,http://localhost:[*],http://127.0.0.1:[*]}"
