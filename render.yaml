# Render Blueprint for the Spring Boot API (backend/).
# Free web service in Frankfurt. The database is NOT created here: it is an external Neon Postgres,
# whose connection string is entered in the Render dashboard (never committed to git).
services:
  - type: web
    name: hellofresh-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon connection string, e.g. postgresql://USER:PASSWORD@ep-xxxx.eu-central-1.aws.neon.tech/hellofresh?sslmode=require
      # The app converts it to JDBC settings at startup. Alternatively set JDBC_DATABASE_URL,
      # JDBC_DATABASE_USERNAME and JDBC_DATABASE_PASSWORD in the dashboard instead.
      - key: DATABASE_URL
        sync: false
      # Browser origins allowed by CORS (comma-separated, Spring origin patterns).
      - key: CORS_ALLOWED_ORIGINS
        value: https://codelady-ship.github.io,http://localhost:[*],http://127.0.0.1:[*]
